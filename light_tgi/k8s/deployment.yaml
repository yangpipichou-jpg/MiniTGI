# ============================================================
# Light TGI K8S 部署清单
#
# 包含:
#   - Namespace
#   - ConfigMap (配置)
#   - Model Server Deployment + Service
#   - Router Deployment + Service + HPA
#
# 部署:
#   kubectl apply -f k8s/deployment.yaml
# ============================================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: light-tgi

---
# ConfigMap: 公共配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: light-tgi-config
  namespace: light-tgi
data:
  MODEL_ID: "Qwen/Qwen2.5-1.5B-Instruct"
  MAX_SEQUENCE_LENGTH: "4096"
  MAX_BATCH_SIZE: "8"
  RUST_LOG: "light_tgi=info"
  # Router 配置
  MODEL_SERVER_HOST: "model-server"
  MODEL_SERVER_PORT: "50051"
  MAX_CONCURRENT_REQUESTS: "64"
  MAX_BATCH_PREFILL_TOKENS: "2048"
  MAX_BATCH_TOTAL_TOKENS: "8192"
  MAX_INPUT_LENGTH: "2048"
  MAX_TOTAL_TOKENS: "4096"
  WAITING_SERVED_RATIO: "1.2"

---
# ============================================================
# Model Server (Python)
# ============================================================

# Model Server Service (ClusterIP, 仅内部访问)
apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: light-tgi
  labels:
    app: model-server
spec:
  type: ClusterIP
  selector:
    app: model-server
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP

---
# Model Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: light-tgi
  labels:
    app: model-server
spec:
  replicas: 1  # 模型服务通常单副本 (模型加载开销大)
  selector:
    matchLabels:
      app: model-server
  strategy:
    type: Recreate  # 模型加载耗时，不能滚动更新
  template:
    metadata:
      labels:
        app: model-server
    spec:
      # GPU 节点选择 (如果有 GPU)
      # nodeSelector:
      #   accelerator: nvidia-tesla-t4
      containers:
        - name: model-server
          image: light-tgi-model-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: light-tgi-config
          env:
            - name: DEVICE
              value: "cpu"  # 改为 "cuda" 如果使用 GPU
            - name: DTYPE
              value: "auto"
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          # 模型缓存持久化 (可选)
          # volumeMounts:
          #   - name: model-cache
          #     mountPath: /root/.cache/huggingface
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; ch=grpc.insecure_channel('localhost:50051'); print('OK')"
            initialDelaySeconds: 60  # 模型加载需要时间
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; ch=grpc.insecure_channel('localhost:50051'); print('OK')"
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
      # volumes:
      #   - name: model-cache
      #     persistentVolumeClaim:
      #       claimName: model-cache-pvc

---
# ============================================================
# Router (Rust)
# ============================================================

# Router Service (LoadBalancer / NodePort，对外暴露)
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: light-tgi
  labels:
    app: router
spec:
  type: LoadBalancer  # 生产环境用 LoadBalancer，测试可用 NodePort
  selector:
    app: router
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

---
# Router Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: light-tgi
  labels:
    app: router
spec:
  replicas: 3  # Router 可水平扩展
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      containers:
        - name: router
          image: light-tgi-router:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: light-tgi-config
          env:
            - name: ROUTER_HOST
              value: "0.0.0.0"
            - name: ROUTER_PORT
              value: "3000"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

---
# Router HPA (水平自动伸缩)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: router-hpa
  namespace: light-tgi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: router
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# PodDisruptionBudget (保证可用性)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: router-pdb
  namespace: light-tgi
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: router
