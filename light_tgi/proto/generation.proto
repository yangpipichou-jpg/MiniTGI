syntax = "proto3";

package light_tgi;

// ============================================================
// Light TGI - gRPC 协议定义 (v3: 事件驱动架构)
//
// 架构变更:
//   - 新增 StreamGenerate RPC: 异步流式推理 (双向流)
//   - 保留批量接口兼容旧逻辑
//   - Router 不做 tokenization，传原始文本
// ============================================================

// ---------- 基本类型 ----------

enum RequestStatus {
  WAITING = 0;
  PREFILL = 1;
  DECODE = 2;
  FINISHED = 3;
  ERROR = 4;
}

enum FinishReason {
  NONE = 0;
  EOS_TOKEN = 1;
  MAX_TOKENS = 2;
  STOP_SEQUENCE = 3;
  ERROR_REASON = 4;
}

message Token {
  int32 id = 1;
  string text = 2;
  float logprob = 3;
  bool special = 4;
}

// ---------- 请求/响应 ----------

message GenerationParameters {
  int32 max_new_tokens = 1;
  float temperature = 2;
  float top_p = 3;
  int32 top_k = 4;
  float repetition_penalty = 5;
  repeated int32 stop_token_ids = 6;
  repeated string stop_strings = 7;
  int32 seed = 8;
  bool do_sample = 9;
}

// Prefill: 发送原始文本
message PrefillRequest {
  string request_id = 1;
  string input_text = 2;
  GenerationParameters params = 3;
  repeated int32 slot_ids = 4;
  int32 batch_id = 5;
}

message PrefillResponse {
  string request_id = 1;
  repeated Token generated_tokens = 2;
  int64 cache_handle = 3;
  int32 prefill_duration_ms = 4;
  int32 prompt_token_count = 5;
}

// Decode
message DecodeRequest {
  string request_id = 1;
  int32 token_id = 2;
  int64 cache_handle = 3;
  GenerationParameters params = 4;
}

message DecodeResponse {
  string request_id = 1;
  Token generated_token = 2;
  FinishReason finish_reason = 3;
  int32 decode_duration_ms = 4;
}

// ---------- ★ 异步流式推理 (事件驱动架构核心) ----------

/// Session 向 Python 发送的请求 (一次完整的生成流程)
message StreamGenerateRequest {
  string request_id = 1;
  string input_text = 2;
  GenerationParameters params = 3;
}

/// Python 向 Session 流式返回的 token
message StreamGenerateResponse {
  string request_id = 1;
  Token generated_token = 2;
  FinishReason finish_reason = 3;
  int32 step = 4;                    // 当前步数 (prefill=0, decode=1,2,...)
  int32 duration_ms = 5;             // 本步耗时
  int64 cache_handle = 6;            // KV cache 句柄 (prefill 步返回)
}

// ---------- 批量接口 (保留) ----------

message BatchPrefillRequest {
  int64 batch_id = 1;
  repeated PrefillRequest requests = 2;
}

message BatchPrefillResponse {
  int64 batch_id = 1;
  repeated PrefillResponse responses = 2;
}

message BatchDecodeRequest {
  int64 batch_id = 1;
  repeated DecodeRequest requests = 2;
}

message BatchDecodeResponse {
  int64 batch_id = 1;
  repeated DecodeResponse responses = 2;
}

// ---------- Tokenize ----------

message TokenizeRequest {
  string text = 1;
}

message TokenizeResponse {
  repeated int32 token_ids = 1;
  int32 token_count = 2;
}

// ---------- 模型信息 ----------

message ModelInfoRequest {}

message ModelInfoResponse {
  string model_id = 1;
  int32 max_sequence_length = 2;
  int32 max_batch_size = 3;
  int32 vocab_size = 4;
  int32 eos_token_id = 5;
  string device = 6;
}

// ---------- 清理缓存 ----------

message ClearCacheRequest {
  repeated int64 cache_handles = 1;
}

message ClearCacheResponse {
  bool success = 1;
}

// ---------- gRPC 服务定义 ----------

service TextGenerationService {
  // 健康检查 / 模型信息
  rpc Health (ModelInfoRequest) returns (ModelInfoResponse);

  // Tokenize: 文本 → token ids
  rpc Tokenize (TokenizeRequest) returns (TokenizeResponse);

  // ★ 异步流式生成 (事件驱动架构核心)
  //   Session 发送一次请求, Python 持续流式返回 token
  //   替代原来的 Prefill → Decode 循环
  rpc StreamGenerate (StreamGenerateRequest) returns (stream StreamGenerateResponse);

  // 批量预填充 (保留, 兼容旧逻辑)
  rpc Prefill (BatchPrefillRequest) returns (BatchPrefillResponse);

  // 批量解码 (保留, 兼容旧逻辑)
  rpc Decode (BatchDecodeRequest) returns (BatchDecodeResponse);

  // 清理 KV cache
  rpc ClearCache (ClearCacheRequest) returns (ClearCacheResponse);
}
