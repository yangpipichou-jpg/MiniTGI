syntax = "proto3";

package light_tgi;

// ============================================================
// Light TGI - gRPC 协议定义
// 定义 Router (Rust) 与 Model Server (Python) 之间的通信协议
// ============================================================

// ---------- 基本类型 ----------

// 请求状态
enum RequestStatus {
  WAITING = 0;    // 等待调度
  PREFILL = 1;    // 预填充阶段（处理 prompt，生成第一个 token）
  DECODE = 2;     // 解码阶段（逐个生成后续 token）
  FINISHED = 3;   // 已完成
  ERROR = 4;      // 出错
}

// 停止原因
enum FinishReason {
  NONE = 0;
  EOS_TOKEN = 1;       // 遇到结束符
  MAX_TOKENS = 2;      // 达到 max_new_tokens
  STOP_SEQUENCE = 3;   // 遇到停止序列
  ERROR_REASON = 4;    // 发生错误
}

// 单个 token 信息
message Token {
  int32 id = 1;
  string text = 2;
  float logprob = 3;
  bool special = 4;
}

// ---------- 请求/响应 ----------

// 生成参数
message GenerationParameters {
  int32 max_new_tokens = 1;      // 最大生成 token 数
  float temperature = 2;         // 温度 (0.0 ~ 2.0)
  float top_p = 3;               // nucleus sampling
  int32 top_k = 4;               // top-k sampling
  float repetition_penalty = 5;  // 重复惩罚
  repeated int32 stop_token_ids = 6;  // 停止 token id 列表
  repeated string stop_strings = 7;   // 停止字符串列表
  int32 seed = 8;                // 随机种子
  bool do_sample = 9;            // 是否采样 (false = greedy)
}

// Prefill 请求 (Rust Router -> Python Server)
message PrefillRequest {
  string request_id = 1;                 // 请求唯一 ID
  repeated int32 input_ids = 2;          // 输入的 token id 列表
  GenerationParameters params = 3;       // 生成参数
  repeated int32 slot_ids = 4;           // KV cache slot 分配
  int32 batch_id = 5;                    // batch 内索引
}

// Prefill 响应
message PrefillResponse {
  string request_id = 1;
  repeated Token generated_tokens = 2;   // 预填充生成的 tokens (含第一个新 token)
  int64 cache_handle = 3;                // KV cache 句柄，后续 decode 使用
  int32 prefill_duration_ms = 4;         // 预填充耗时 (ms)
}

// Decode 请求 (Rust Router -> Python Server)
message DecodeRequest {
  string request_id = 1;
  int32 token_id = 2;                    // 上一步生成的 token id
  int64 cache_handle = 3;                // KV cache 句柄
  GenerationParameters params = 4;
}

// Decode 响应
message DecodeResponse {
  string request_id = 1;
  Token generated_token = 2;
  FinishReason finish_reason = 3;
  int32 decode_duration_ms = 4;
}

// ---------- 批量接口 ----------

// 批量 Prefill 请求
message BatchPrefillRequest {
  int64 batch_id = 1;
  repeated PrefillRequest requests = 2;
}

// 批量 Prefill 响应
message BatchPrefillResponse {
  int64 batch_id = 1;
  repeated PrefillResponse responses = 2;
}

// 批量 Decode 请求
message BatchDecodeRequest {
  int64 batch_id = 1;
  repeated DecodeRequest requests = 2;
}

// 批量 Decode 响应
message BatchDecodeResponse {
  int64 batch_id = 1;
  repeated DecodeResponse responses = 2;
}

// 模型信息请求
message ModelInfoRequest {}

// 模型信息响应
message ModelInfoResponse {
  string model_id = 1;
  int32 max_sequence_length = 2;
  int32 max_batch_size = 3;
  int32 vocab_size = 4;
  int32 eos_token_id = 5;
}

// ---------- gRPC 服务定义 ----------

service TextGenerationService {
  // 健康检查
  rpc Health (ModelInfoRequest) returns (ModelInfoResponse);

  // 批量预填充：处理整个 batch 的 prompt，生成首 token
  rpc Prefill (BatchPrefillRequest) returns (BatchPrefillResponse);

  // 批量解码：对 batch 中所有请求逐个生成下一个 token
  rpc Decode (BatchDecodeRequest) returns (BatchDecodeResponse);

  // 清理 KV cache 资源
  rpc ClearCache (ClearCacheRequest) returns (ClearCacheResponse);
}

// 清理缓存请求
message ClearCacheRequest {
  repeated int64 cache_handles = 1;
}

// 清理缓存响应
message ClearCacheResponse {
  bool success = 1;
}
