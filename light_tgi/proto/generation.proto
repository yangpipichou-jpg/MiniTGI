syntax = "proto3";

package light_tgi;

// ============================================================
// Light TGI - gRPC 协议定义 (v4: 生产级 Continuous Batching)
//
// 架构变更:
//   - 新增 BatchStreamGenerate: 双向流 — Rust 持续推送请求, Python 批量 forward
//   - 新增 PrefixCacheLookup / PrefixCacheStore: Prefix Sharing
//   - 保留 StreamGenerate 用于单请求场景
// ============================================================

// ---------- 基本类型 ----------

enum RequestStatus {
  WAITING = 0;
  PREFILL = 1;
  DECODE = 2;
  FINISHED = 3;
  ERROR = 4;
}

enum FinishReason {
  NONE = 0;
  EOS_TOKEN = 1;
  MAX_TOKENS = 2;
  STOP_SEQUENCE = 3;
  ERROR_REASON = 4;
}

enum BatchCommandType {
  ADD_REQUEST = 0;      // 新增请求 (prefill)
  CANCEL_REQUEST = 1;   // 取消请求
  BATCH_DECODE = 2;     // 批量 decode 步 (由 Python 端定时触发)
}

message Token {
  int32 id = 1;
  string text = 2;
  float logprob = 3;
  bool special = 4;
}

// ---------- 请求/响应 ----------

message GenerationParameters {
  int32 max_new_tokens = 1;
  float temperature = 2;
  float top_p = 3;
  int32 top_k = 4;
  float repetition_penalty = 5;
  repeated int32 stop_token_ids = 6;
  repeated string stop_strings = 7;
  int32 seed = 8;
  bool do_sample = 9;
}

// ---------- ★ BatchStreamGenerate: 双向流 Continuous Batching (v4 核心) ----------

/// Rust → Python: 批量调度命令
message BatchCommand {
  BatchCommandType command_type = 1;
  repeated StreamGenerateRequest new_requests = 2;  // ADD_REQUEST 时携带
  repeated string cancel_request_ids = 3;            // CANCEL_REQUEST 时携带
  int64 batch_id = 4;
}

/// Python → Rust: 批量 token 输出
message BatchStreamResponse {
  int64 batch_id = 1;
  repeated StreamGenerateResponse tokens = 2;
  int32 active_requests = 3;         // 当前 batch 中的活跃请求数
  int32 batch_decode_ms = 4;         // 本步 batch decode 耗时
}

// ---------- ★ Prefix Sharing (v4 新增) ----------

message PrefixCacheLookupRequest {
  string prefix_text = 1;   // 前缀文本
  int32 min_match_tokens = 2; // 最小匹配 token 数
}

message PrefixCacheLookupResponse {
  bool found = 1;
  int64 shared_cache_handle = 2;  // 可复用的 cache handle
  int32 matched_tokens = 3;       // 匹配的 token 数
}

message PrefixCacheStoreRequest {
  string prefix_text = 1;
  int64 cache_handle = 2;
  int32 token_count = 3;
}

message PrefixCacheStoreResponse {
  bool success = 1;
}

// ---------- 原有消息 (保留兼容) ----------

message PrefillRequest {
  string request_id = 1;
  string input_text = 2;
  GenerationParameters params = 3;
  repeated int32 slot_ids = 4;
  int32 batch_id = 5;
}

message PrefillResponse {
  string request_id = 1;
  repeated Token generated_tokens = 2;
  int64 cache_handle = 3;
  int32 prefill_duration_ms = 4;
  int32 prompt_token_count = 5;
}

message DecodeRequest {
  string request_id = 1;
  int32 token_id = 2;
  int64 cache_handle = 3;
  GenerationParameters params = 4;
}

message DecodeResponse {
  string request_id = 1;
  Token generated_token = 2;
  FinishReason finish_reason = 3;
  int32 decode_duration_ms = 4;
}

message StreamGenerateRequest {
  string request_id = 1;
  string input_text = 2;
  GenerationParameters params = 3;
}

message StreamGenerateResponse {
  string request_id = 1;
  Token generated_token = 2;
  FinishReason finish_reason = 3;
  int32 step = 4;
  int32 duration_ms = 5;
  int64 cache_handle = 6;
}

message BatchPrefillRequest {
  int64 batch_id = 1;
  repeated PrefillRequest requests = 2;
}

message BatchPrefillResponse {
  int64 batch_id = 1;
  repeated PrefillResponse responses = 2;
}

message BatchDecodeRequest {
  int64 batch_id = 1;
  repeated DecodeRequest requests = 2;
}

message BatchDecodeResponse {
  int64 batch_id = 1;
  repeated DecodeResponse responses = 2;
}

message TokenizeRequest {
  string text = 1;
}

message TokenizeResponse {
  repeated int32 token_ids = 1;
  int32 token_count = 2;
}

message ModelInfoRequest {}

message ModelInfoResponse {
  string model_id = 1;
  int32 max_sequence_length = 2;
  int32 max_batch_size = 3;
  int32 vocab_size = 4;
  int32 eos_token_id = 5;
  string device = 6;
}

message ClearCacheRequest {
  repeated int64 cache_handles = 1;
}

message ClearCacheResponse {
  bool success = 1;
}

// ---------- gRPC 服务定义 (v4) ----------

service TextGenerationService {
  rpc Health (ModelInfoRequest) returns (ModelInfoResponse);
  rpc Tokenize (TokenizeRequest) returns (TokenizeResponse);

  // ★ v4 核心: 双向流 Continuous Batching
  //   Rust Router 持续推送新请求 + 取消指令
  //   Python Model Server 批量 forward, 流式返回所有请求的 token
  rpc BatchStreamGenerate (stream BatchCommand) returns (stream BatchStreamResponse);

  // ★ Prefix Sharing
  rpc PrefixCacheLookup (PrefixCacheLookupRequest) returns (PrefixCacheLookupResponse);
  rpc PrefixCacheStore (PrefixCacheStoreRequest) returns (PrefixCacheStoreResponse);

  // 单请求流式生成 (兼容, 用于调试/fallback)
  rpc StreamGenerate (StreamGenerateRequest) returns (stream StreamGenerateResponse);

  // 批量接口 (保留兼容)
  rpc Prefill (BatchPrefillRequest) returns (BatchPrefillResponse);
  rpc Decode (BatchDecodeRequest) returns (BatchDecodeResponse);
  rpc ClearCache (ClearCacheRequest) returns (ClearCacheResponse);
}
